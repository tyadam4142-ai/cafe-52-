<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café 52 | Pune Camp</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- Reset & Global Variables --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #121318;
            --card-grey: rgba(28, 30, 38, 0.88);
            --star-grey: #2d313f;
            --brand-red: #ff2a00;
            --brand-orange: #ff7700;
            --brand-yellow: #ffc400;
            --text-glow: linear-gradient(135deg, #ff2a00 0%, #ff7700 50%, #ffc400 100%);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* --- Dynamic Shining Starry Background --- */
        .starry-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #242733 0%, #101116 100%);
            z-index: -2;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(1.5px 1.5px at 15px 25px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 75px 120px, #ffaa00, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 140px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 220px 180px, #ff4500, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 310px 90px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: starryTwinkle 4s ease-in-out infinite alternate;
        }

        @keyframes starryTwinkle {
            0% { opacity: 0.3; transform: scale(0.99); }
            50% { opacity: 0.8; }
            100% { opacity: 1; transform: scale(1.01); }
        }

        /* --- Calibrated Starry Grey Card Container --- */
        .card {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: var(--card-grey);
            border-radius: 28px;
            padding: 35px 25px;
            border: 2px solid rgba(255, 119, 0, 0.35);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(255, 69, 0, 0.25),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            text-align: center;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* Inner card subtle starry glow texture */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 10%, rgba(255, 69, 0, 0.12), transparent 70%),
                        radial-gradient(2px 2px at 40px 80px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 200px 150px, #ffbb00, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 320px 240px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 280px 280px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        @keyframes cardAppear {
            from { transform: translateY(40px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* --- Red-Orangish Header & Branding --- */
        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: var(--text-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 12px rgba(255, 42, 0, 0.4));
            animation: flamePulse 3s infinite alternate;
        }

        @keyframes flamePulse {
            0% { filter: drop-shadow(0 0 8px rgba(255, 42, 0, 0.4)); }
            100% { filter: drop-shadow(0 0 20px rgba(255, 196, 0, 0.7)); }
        }

        .subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--brand-yellow);
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* --- Contact & Info Details --- */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 119, 0, 0.2);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(255, 119, 0, 0.1);
            border-color: var(--brand-orange);
            transform: translateX(4px);
        }

        .info-item i {
            font-size: 1.3rem;
            width: 35px;
            background: var(--text-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-item-text {
            font-size: 0.95rem;
            color: #ececec;
            line-height: 1.4;
        }

        .info-item-text a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .info-item-text a:hover {
            color: var(--brand-yellow);
        }

        /* --- Action Buttons --- */
        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.35s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brand-red), var(--brand-orange));
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-yellow));
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(255, 69, 0, 0.6);
            color: #111;
        }

        .btn-secondary {
            background: transparent;
            color: var(--brand-yellow);
            border: 2px solid var(--brand-orange);
        }

        .btn-secondary:hover {
            background: var(--brand-orange);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(255, 119, 0, 0.5);
        }

        /* --- Feedback Banner & QR Code --- */
        .feedback-box {
            background: linear-gradient(180deg, rgba(255, 69, 0, 0.12), rgba(0,0,0,0.3));
            border: 1px dashed var(--brand-orange);
            border-radius: 20px;
            padding: 20px 15px;
            margin-top: 10px;
        }

        .feedback-title {
            color: var(--brand-yellow);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .qr-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }

        .qr-img {
            width: 170px;
            height: 170px;
            border-radius: 16px;
            border: 4px solid var(--brand-orange);
            background: #ffffff;
            padding: 8px;
            box-shadow: 0 0 20px rgba(255, 119, 0, 0.4);
            animation: floatQR 4s ease-in-out infinite;
        }

        @keyframes floatQR {
            0% { transform: translateY(0px); box-shadow: 0 0 18px rgba(255, 42, 0, 0.4); }
            50% { transform: translateY(-8px); box-shadow: 0 0 30px rgba(255, 196, 0, 0.8); }
            100% { transform: translateY(0px); box-shadow: 0 0 18px rgba(255, 42, 0, 0.4); }
        }
    </style>
</head>
<body>

    <!-- Starry Night Background -->
    <div class="starry-bg"></div>
    <div class="stars-container"></div>

    <!-- Main Card Container -->
    <div class="card">
        <div class="card-content">
            
            <!-- Branding -->
            <h1 class="brand-title">Café 52</h1>
            <p class="subtitle">MOHAMMEDI SWEETS</p>

            <!-- Contact Information -->
            <div class="info-list">
                <div class="info-item">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <div class="info-item-text">
                        Mobile: <a href="tel:+918007421786">+91 8007421786</a>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <div class="info-item-text">
                        Landline: <a href="tel:+912045143188">+91 20 45143188</a>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fa-brands fa-instagram"></i>
                    <div class="info-item-text">
                        Instagram: <a href="https://instagram.com/Cafeteria_52" target="_blank">@Cafeteria_52</a>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div class="info-item-text">
                        Shop no. 1, Kumar Corner Building, opposite Hermes House, near Choksey School, Pune Camp 411001
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-btns">
                <a href="https://maps.app.goo.gl/qxSWgaXWz4uGE4zv8?g_st=ac" target="_blank" class="btn btn-primary">
                    <i class="fa-solid fa-map-location-dot"></i> Open Google Maps
                </a>
                <a href="https://g.page/r/Cb1JARiFiwFTEAE/review" target="_blank" class="btn btn-secondary">

            <!-- Review Feedback & Animated QR Code Section -->
            <div class="feedback-box">
                <p class="feedback-title">"Cafe-52 would love your feedback. Post a review to our profile."</p>
                <div class="qr-wrapper">
                    <!-- Ensure image file name matches your local file -->
                    <img src="PHOTO-2026-09-28-17-58-54.jpg" alt="Café 52 QR Code" class="qr-img">
                </div>
            </div>

        </div>
    </div>

</body>
</html>
