<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café 52 - 8K Kinetic Display (Mohammedi Sweets)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background: radial-gradient(circle at center, #11141e 0%, #05060a 100%);
    }
    .spit-title {
      font-family: 'Great Vibes', cursive;
      font-size: 5rem;
      color: #e52b2b;
      text-shadow: 0 0 20px rgba(229, 43, 43, 0.8);
    }
    .brand-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: #ff9f1c;
      letter-spacing: 0.2em;
    }
    .qr-card {
      margin-top: 2rem;
      padding: 1.5rem;
      border: 2px solid #ff5e1a;
      border-radius: 1rem;
      background: rgba(15, 20, 30, 0.9);
      box-shadow: 0 0 40px rgba(255, 94, 26, 0.35);
      text-align: center;
    }
    .qr52-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff5e1a;
      text-shadow: 0 0 15px #ff5e1a;
    }
  </style>
</head>
<body>
  <div style="text-align:center;">
    <div class="spit-title">Café 52</div>
    <div class="brand-sub">MOHAMMEDI SWEETS · KINETIC DISPLAY</div>
  </div>
  <div class="qr-card">
    <div class="qr52-text">QR52</div>
    <p style="margin-top:0.5rem; font-size:0.9rem; color:#cbd5e1;">Scan or WhatsApp: +91 98205 25252</p>
  </div>
</body>
</html>
